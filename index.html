<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>大電視輪播系統</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #ytWrap {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
        }
        #ytWrap iframe { width: 100%; height: 100%; }

        /* 底部感應區：滑鼠移入或觸控點擊時，浮出選單 */
        #hotzone {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 70px;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        #bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 14px;
            transform: translateY(150%);
            opacity: 0;
            transition: transform 0.25s ease, opacity 0.25s ease;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }
        #hotzone:hover #bar,
        #hotzone.show #bar {
            transform: translateY(0);
            opacity: 1;
        }
        #bar button {
            border: none;
            padding: 10px 18px;
            font-size: 18px;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
        }
        #bar button:hover { background: rgba(255, 255, 255, 0.3); }
        #bar button.active { background: #2e86ff; }

        /* 常駐的小選單按鈕（右下角） */
        #handle {
            position: fixed;
            right: 14px;
            bottom: 14px;
            z-index: 1000;
            border: none;
            padding: 8px 14px;
            font-size: 16px;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 10px;
            cursor: pointer;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }
        #handle:hover { background: rgba(0, 0, 0, 0.85); }
    </style>
</head>
<body>

<iframe id="displayFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
<div id="ytWrap"><div id="ytPlayer"></div></div>

<div id="hotzone">
    <div id="bar"></div>
</div>
<button id="handle">☰ 選單</button>

<script>
    // 名稱 + 網址（想改按鈕文字，改 name 即可）
    const pages = [
        { name: "閱讀之星", url: "https://257170-ship-it.github.io/readingstar/" },
        { name: "校園存錢筒", url: "https://257170-ship-it.github.io/school-piggy/" },
        { name: "百本閱讀", url: "https://257170-ship-it.github.io/100-Book/" },
        { name: "影片", playlist: "PLLshOS_H94JI" }   // YouTube 播放清單 ID（list= 後面那串）
    ];

    // 停留時間：30 分鐘（測試時可改成 5000 = 5 秒）
    const timeInterval = 30 * 60 * 1000;

    const displayFrame = document.getElementById("displayFrame");
    const hotzone = document.getElementById("hotzone");
    const bar = document.getElementById("bar");
    let currentIndex = 0;
    let timer = null;
    let hideTimer = null;

    // 建立按鈕
    const prevBtn = makeButton("◀ 上一頁", () => go(currentIndex - 1));
    const nextBtn = makeButton("下一頁 ▶", () => go(currentIndex + 1));
    const pageBtns = pages.map((p, i) => makeButton(p.name, () => go(i)));

    bar.appendChild(prevBtn);
    pageBtns.forEach(b => bar.appendChild(b));
    bar.appendChild(nextBtn);

    function makeButton(text, onClick) {
        const b = document.createElement("button");
        b.textContent = text;
        b.addEventListener("click", onClick);
        return b;
    }

    // ===== YouTube 播放清單（用官方 IFrame API，確保自動播放）=====
    const ytWrap = document.getElementById("ytWrap");
    let ytPlayer = null;
    let ytReady = false;
    let pendingPlaylist = null;

    const apiTag = document.createElement("script");
    apiTag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(apiTag);

    window.onYouTubeIframeAPIReady = () => {
        ytPlayer = new YT.Player("ytPlayer", {
            width: "100%",
            height: "100%",
            playerVars: { playsinline: 1, rel: 0 },
            events: {
                onReady: () => {
                    ytReady = true;
                    if (pendingPlaylist) startPlaylist(pendingPlaylist);
                },
                // 自動播放被擋：靜音後再試一次
                onAutoplayBlocked: () => { ytPlayer.mute(); ytPlayer.playVideo(); },
                onStateChange: (e) => {
                    if (e.data === YT.PlayerState.UNSTARTED && ytWrap.style.display === "block") {
                        ytPlayer.mute();
                        ytPlayer.playVideo();
                    }
                },
                // 影片不能嵌入或已刪除：自動跳下一支
                onError: () => { ytPlayer.nextVideo(); }
            }
        });
    };

    function startPlaylist(id) {
        pendingPlaylist = null;
        ytPlayer.mute();   // 靜音才能保證自動播放；要聲音請見說明
        ytPlayer.loadPlaylist({ listType: "playlist", list: id, index: 0 });
        ytPlayer.setLoop(true);
    }

    function showPage(page) {
        if (page.playlist) {
            displayFrame.src = "about:blank";
            ytWrap.style.display = "block";
            if (ytReady) startPlaylist(page.playlist);
            else pendingPlaylist = page.playlist;
        } else {
            pendingPlaylist = null;
            if (ytReady) ytPlayer.stopVideo();
            ytWrap.style.display = "none";
            displayFrame.src = page.url;
        }
    }

    // 切換到指定頁面，並重新計時
    function go(index) {
        currentIndex = (index + pages.length) % pages.length;
        showPage(pages[currentIndex]);
        pageBtns.forEach((b, i) => b.classList.toggle("active", i === currentIndex));
        restartTimer();
    }

    function restartTimer() {
        clearInterval(timer);
        timer = setInterval(() => go(currentIndex + 1), timeInterval);
    }

    // 觸控螢幕：點底部感應區顯示選單，5 秒後自動收起
    hotzone.addEventListener("touchstart", () => {
        hotzone.classList.add("show");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => hotzone.classList.remove("show"), 5000);
    });

    // 鍵盤左右鍵切換
    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") go(currentIndex - 1);
        if (e.key === "ArrowRight") go(currentIndex + 1);
    });

    // 初始化
    go(0);
</script>

</body>
</html>
